# /etc/nginx/sites-available/free-ai-hub  (сертификат: certbot --nginx -d chat-log.example.com)
limit_req_zone $binary_remote_addr zone=fah_login:1m rate=10r/m;

server {
    listen 80;
    server_name chat-log.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat-log.example.com;
    ssl_certificate     /etc/letsencrypt/live/chat-log.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-log.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512k;
    server_tokens off;
    access_log off;                       # адреса посетителей не логируем

    location = /api/admin/login {
        limit_req zone=fah_login burst=5 nodelay;
        include /etc/nginx/fah-proxy.conf;
    }
    location / {
        include /etc/nginx/fah-proxy.conf;
    }
}
